}

  color-scheme:dark}}

*{box-sizing:border-box}
body{

  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:18px; line-height:1.5; min-height:100vh;
}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:inherit}

.btn{min-height:56px;padding:0 22px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--card);font-family:var(--f-display);font-weight:600;font-size:1.1rem}

.btn.small{min-height:44px;font-size:1rem;padding:0 16px}

.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px 0;min-height:44px}

.kidcard{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;border-top:10px solid var(--accent)}

.section{display:flex;flex-direction:column;gap:10px}
.fach{font-family:var(--f-display);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.topic{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%}
.topic:hover{border-color:var(--accent)}

.stars .off{color:var(--line)}
.pill{font-size:.85rem;padding:4px 10px;border-radius:999px;white-space:nowrap;font-weight:700}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

.field input.right{border-color:var(--good);background:var(--good-bg)} .field input.wrong{border-color:var(--bad);background:var(--bad-bg)}

.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)} .fb.skip{background:var(--warn-bg)}

.row{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:12px;align-items:center}

.note{font-size:.95rem;color:var(--muted);border-left:4px solid var(--line);padding-left:12px}

details.check[open]{display:flex;flex-direction:column;gap:14px}
.warnbox{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:12px 14px}

/* ---------- Würfelnetze als kleine Zeichnung ---------- */
function net(cells){
  const s=26, cols=Math.max(...cells.map(c=>c[0]))+1, rows=Math.max(...cells.map(c=>c[1]))+1;
  const r=cells.map(([x,y])=>`<rect x="${x*s+2}" y="${y*s+2}" width="${s}" height="${s}" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${cols*s+4} ${rows*s+4}" width="${(cols*s+4)*1.4}" role="img" aria-label="Netz">${r}</svg>`;
}

/* ---------- Speicher ---------- */
const KEY='lernstand-check-v1';
const STORAGE_OK=(()=>{try{localStorage.setItem(KEY+'-test','1');const ok=localStorage.getItem(KEY+'-test')==='1';localStorage.removeItem(KEY+'-test');return ok}catch(e){return false}})();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function backupCode(){return 'LERN1:'+btoa(unescape(encodeURIComponent(JSON.stringify(DB))))}
function readBackup(code){code=String(code).replace(/\s/g,'');if(!code.startsWith('LERN1:'))throw new Error('format');const d=JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));if(!d||typeof d!=='object')throw new Error('format');return d}
let DB=load();
function res(kid,tid){return (DB[kid]||{})[tid]}

/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseNum(s){s=String(s).trim().replace(/\s| /g,'').replace(/[−–]/g,'-').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');if(s===''||isNaN(s))return null;return parseFloat(s)}
function pct(r){return r?Math.round(100*r.score/r.total):0}
function level(p){return p>=80?'good':p>=50?'warn':'bad'}
const LEVEL_TXT={good:'sitzt gut',warn:'noch üben',bad:'Schwerpunkt'};
function starCount(p){return p>=90?3:p>=70?2:p>=40?1:0}
function starsHtml(n,cls='stars'){return `<span class="${cls}" aria-label="${n} von 3 Sternen">${'★'.repeat(n)}<span class="off">${'★'.repeat(3-n)}</span></span>`}
const fmtDate=d=>new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});

/* ---------- Ansichten ---------- */
let S={view:'home'};
function go(v){S=Object.assign({},v);render();window.scrollTo(0,0)}

function render(){
  const app=$('#app');app.className='wrap'+(S.kid?' kid-'+S.kid:'');
  if(S.view==='home')return home(app);
  if(S.view==='kid')return kidView(app);
  if(S.view==='quiz')return quiz(app);
  if(S.view==='done')return done(app);
  if(S.view==='eltern')return eltern(app);
  if(S.view==='ueben')return uebenView(app);
  if(S.view==='uebenDone')return uebenDone(app);
}

function home(app){
  const cards=Object.entries(KIDS).map(([k,K])=>{
    const n=K.topics.length,d=K.topics.filter(t=>res(k,t.id)).length;
    return `<button class="kidcard kid-${k}" data-kid="${k}">
      <span class="name">${K.name}</span><span class="muted">${K.info}</span>
      <div class="meter" aria-hidden="true"><i style="width:${100*d/n}%"></i></div>
      <span>★ ${sterne(k)} Sterne${badgeOf(sterne(k))?' · '+badgeOf(sterne(k))[1]:''}</span></button>`}).join('');
  app.innerHTML=`<div class="top"><h1>Wer lernt heute?</h1></div>
    <p class="muted">Tippe auf deinen Namen. Du übst mit Aufgaben, die immer wieder neu sind und zu dir passen. Für jede richtige Antwort gibt es einen Stern. Es gibt keine Noten.</p>
    ${STORAGE_OK?'':'<p class="warnbox"><b>Achtung:</b> Dieser Browser speichert die Ergebnisse nicht dauerhaft. Bitte sag Mama oder Papa Bescheid.</p>'}<div class="kids">${cards}</div>
    <div class="actions"><button class="link" id="toEltern">Für Eltern: Auswertung ansehen</button></div>`;
  app.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>go({view:'kid',kid:b.dataset.kid}));
  $('#toEltern').onclick=()=>go({view:'eltern'});
}

function kidView(app){
  const K=KIDS[S.kid],n=sterne(S.kid),b=badgeOf(n),nb=nextBadge(n);
  const prevB=nb?(b?b[0]:0):0;
  const wallet=`<div class="wallet"><span class="big">★ ${n} Sterne</span>${b?`<span>Dein Abzeichen: <b>${b[1]}</b></span>`:''}
    ${nb?`<div class="meter" aria-hidden="true"><i style="width:${Math.round(100*(n-prevB)/(nb[0]-prevB))}%;background:var(--star)"></i></div><span class="muted">Noch ${nb[0]-n} Sterne bis „${nb[1]}“</span>`:'<span class="muted">Du hast alle Abzeichen!</span>'}</div>`;
  const grp={};UEB[S.kid].forEach(t=>(grp[t.grp]=grp[t.grp]||[]).push(t));
  const ueb=['emp','fit','neu'].filter(g=>grp[g]).map(g=>`<div class="section"><span class="fach">${GRP[g]}</span>${grp[g].map(t=>{
    const u=peekU(S.kid,t.id);
    const right=u&&u.total?`<span class="lvl">Stufe ${u.lvl}<span class="lvlbar">${[1,2,3].map(i=>`<i class="${i<=u.lvl?'on':''}"></i>`).join('')}</span></span>`:'<span class="pill open">Neu</span>';
    return `<button class="topic" data-u="${t.id}"><span class="t"><b>${t.titel}</b><span class="muted">${t.kurz}</span><span class="tag">${t.fach}</span></span>${right}</button>`}).join('')}</div>`).join('');
  const groups={};K.topics.forEach(t=>(groups[t.fach]=groups[t.fach]||[]).push(t));
  const done=K.topics.filter(t=>res(S.kid,t.id)).length;
  const check=Object.entries(groups).map(([f,ts])=>`<div class="section"><span class="fach">${f}</span>${ts.map(t=>{
    const r=res(S.kid,t.id);
    const right=r?starsHtml(starCount(pct(r))):`<span class="pill open">${t.fragen.length} Aufgaben</span>`;
    return `<button class="topic" data-t="${t.id}"><span class="t"><b>${t.titel}</b><span class="muted">${t.kurz}</span></span>${right}</button>`}).join('')}</div>`).join('');
  app.innerHTML=`<div class="top"><h1>Hallo ${K.name}!</h1><button class="btn ghost small" id="back">Zurück</button></div>
    ${wallet}
    <p class="muted">Eine Runde hat ${SESSION} Aufgaben. Wenn du dreimal hintereinander richtig liegst, geht es eine Stufe höher.</p>
    ${ueb}
    <details class="check"><summary>Lernstand-Check (${done} von ${K.topics.length} Themen gemacht)</summary>${check}</details>`;
  $('#back').onclick=()=>go({view:'home'});
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>startUeben(b.dataset.u));
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.t));
}

function topicOf(kid,tid){return KIDS[kid].topics.find(t=>t.id===tid)}
function startQuiz(tid){
  const t=topicOf(S.kid,tid);
  const order=t.fragen.map(f=>f.t==='mc'?shuffle(f.opts.map((o,i)=>i)):null);
  go({view:'quiz',kid:S.kid,tid,idx:0,log:[],order,checked:false});
}

function quiz(app){
  const t=topicOf(S.kid,S.tid),f=t.fragen[S.idx],n=t.fragen.length;
  const dots=t.fragen.map((_,i)=>{const l=S.log[i];return `<i class="${l?(l.ok?'ok':'no'):(i===S.idx?'now':'')}"></i>`}).join('');
  let body='';
  if(f.t==='mc'){
    body=`<div class="opts">${S.order[S.idx].map(i=>`<button class="opt${f.big?' big':''}" data-i="${i}">${f.html?f.opts[i]:esc(f.opts[i])}</button>`).join('')}</div>`;
  }else if(f.t==='num'){
    body=`<div class="inputs"><div class="field"><label for="in0">Deine Antwort</label><input id="in0" inputmode="decimal" autocomplete="off"></div>${f.unit?`<span class="unit">${f.unit}</span>`:''}</div>`;
  }else{
    const L=f.labels||['Ergebnis','Rest'];
    body=`<div class="inputs"><div class="field"><label for="in0">${L[0]}</label><input id="in0" inputmode="numeric" autocomplete="off"></div><div class="field"><label for="in1">${L[1]}</label><input id="in1" inputmode="numeric" autocomplete="off"></div></div>`;
  }
  app.innerHTML=`<div class="top"><div><span class="fach">${t.fach} · ${t.titel}</span><p class="muted">Aufgabe ${S.idx+1} von ${n}</p></div><button class="btn ghost small" id="pause">Pause</button></div>
    <div class="quiz pop"><div class="dots" aria-hidden="true">${dots}</div>
      <div class="q">${esc(f.q)}${f.calc?`<span class="calc">${esc(f.calc)}</span>`:''}</div>
      ${body}<div id="fb"></div>
      <div class="actions" id="acts"><button class="btn" id="check" disabled>Prüfen</button><button class="btn ghost" id="skip">Weiß ich noch nicht</button></div>
    </div>`;
  $('#pause').onclick=()=>go({view:'kid',kid:S.kid});
  const check=$('#check');let sel=null;
  if(f.t==='mc'){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.checked)return;app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i;check.disabled=false});
  }else{
    const ins=[...app.querySelectorAll('input')];
    const upd=()=>{check.disabled=ins.some(i=>parseNum(i.value)===null)};
    ins.forEach(i=>{i.oninput=upd;i.onkeydown=e=>{if(e.key==='Enter'&&!check.disabled)check.click()}});
    ins[0].focus({preventScroll:true});
  }
  check.onclick=()=>{
    let ok,given;
    if(f.t==='mc'){ok=sel===0;given=f.html?'(Bild '+(S.order[S.idx].indexOf(sel)+1)+')':f.opts[sel]}
    else if(f.t==='num'){const v=parseNum($('#in0').value);ok=f.a.some(a=>Math.abs(a-v)<1e-9);given=$('#in0').value}
    else{const q=parseNum($('#in0').value),r=parseNum($('#in1').value);ok=q===f.a[0]&&r===f.a[1];given=q+' Rest '+r}
    finish(ok,given,false);
  };
  $('#skip').onclick=()=>finish(false,'weiß ich noch nicht',true);

  function finish(ok,given,skipped){
    S.checked=true;S.log[S.idx]={ok,given,skipped};
    if(f.t==='mc'){app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===0)b.classList.add('right');else if(i===sel)b.classList.add('wrong')})}
    else app.querySelectorAll('input').forEach(i=>{i.disabled=true;i.classList.add(ok?'right':'wrong')});
    const sol=f.t==='mc'?'':(f.t==='num'?`Richtig ist: <b>${String(f.a[0]).replace('.',',')}${f.unit?' '+f.unit:''}</b>. `:`Richtig ist: <b>${f.a[0]} Rest ${f.a[1]}</b>. `);
    const fb=$('#fb');
    if(ok)fb.innerHTML=`<div class="fb ok pop"><h3>Richtig, super!</h3><p>${esc(f.erk)}</p></div>`;
    else if(skipped)fb.innerHTML=`<div class="fb skip pop"><h3>Kein Problem, genau dafür ist der Test da.</h3><p>${sol}${esc(f.erk)}</p></div>`;
    else fb.innerHTML=`<div class="fb no pop"><h3>Noch nicht ganz.</h3><p>${sol}${esc(f.erk)}</p></div>`;
    const last=S.idx===t.fragen.length-1;

function reportText(){
  const lines=['Lernstand-Check, Stand '+fmtDate(Date.now()),''];
  for(const [k,K] of Object.entries(KIDS)){
    lines.push(K.name+' ('+K.info+')');
    for(const t of K.topics){
      const r=res(k,t.id);
      if(!r){lines.push('- '+t.fach+' / '+t.titel+': noch nicht gemacht');continue}
      const p=pct(r);
      lines.push('- '+t.fach+' / '+t.titel+': '+r.score+'/'+r.total+' ('+p+' %, '+LEVEL_TXT[level(p)]+')');
      r.log.forEach((l,i)=>{if(!l.ok){const f=t.fragen[i];lines.push('    falsch: '+f.q+(f.calc?' '+f.calc:'')+' | Antwort: '+l.given)}});
    }
    lines.push('');
  }
  return lines.join('\n')+uebenReport();
}

 function finish(ok,given,skipped){
  if(S.checked)return;S.checked=true;
  const old=st.lvl;let lvMsg='';
  st.total++;st.last=Date.now();
  if(ok){st.right++;S.right++;st.up++;st.down=0;S.stars++;
   DB.sterne=DB.sterne||{};DB.sterne[S.kid]=sterne(S.kid)+1;
   if(st.up>=3&&st.lvl<3){st.lvl++;st.up=0;S.stars++;DB.sterne[S.kid]++;lvMsg=`<p class="lvup">Stark! Du bist jetzt auf Stufe ${st.lvl}. Dafür gibt es einen Extra-Stern.</p>`}}
  else{st.down++;st.up=0;
   if(st.down>=2&&st.lvl>1){st.lvl--;st.down=0;lvMsg=`<p>Wir gehen kurz auf Stufe ${st.lvl} zurück und üben dort weiter.</p>`}
   DB.fehler=DB.fehler||{};const L=DB.fehler[S.kid]=DB.fehler[S.kid]||[];
   L.unshift({tid:S.tid,lvl:old,q:f.q+(f.calc?' '+f.calc:''),given,date:Date.now()});L.length=Math.min(L.length,40);
  }
  save(DB);
  if(f.kind==='mc')app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===0)b.classList.add('right');else if(i===sel)b.classList.add('wrong')});
  else app.querySelectorAll('input').forEach(i=>{i.disabled=true;i.classList.add(ok?'right':'wrong')});
  const sol=f.kind==='num'?`Richtig ist: <b>${f.unit==='€'?eur(f.a):zahl(f.a)}${f.unit?' '+f.unit:''}</b>.<br>`:f.kind==='time'?`Richtig ist: <b>${uhr(f.a[0],f.a[1])} Uhr</b>.<br>`:f.kind==='rest'?`Richtig ist: <b>${f.a[0]} Rest ${f.a[1]}</b>.<br>`:'';
  const fb=$('#fb');
  if(ok)fb.innerHTML=`<div class="fb ok pop"><h3>${pick(['Richtig, super!','Genau!','Klasse, stimmt!','Richtig!'])} ★</h3>${lvMsg}<details><summary>Rechenweg ansehen</summary><p>${f.erk}</p></details></div>`;
  else fb.innerHTML=`<div class="fb ${skipped?'skip':'no'} pop"><h3>${skipped?'Kein Problem, so geht es:':'Noch nicht ganz. So geht es:'}</h3><p>${sol}${f.erk}</p>${lvMsg}</div>`;
  const last=S.n===SESSION-1;
  $('#acts').innerHTML=`<button class="btn" id="next">${last?'Fertig':'Nächste Aufgabe'}</button>`;
  $('#next').onclick=()=>{if(last)go(Object.assign({},S,{view:'uebenDone'}));else{S.n++;newTask();render();window.scrollTo(0,0)}};
  $('#next').focus({preventScroll:true});
 }
}

function uebenDone(app){
 const t=UEB[S.kid].find(x=>x.id===S.tid),st=ust(S.kid,S.tid),now=sterne(S.kid);
 const bOld=badgeOf(S.startStars),bNew=badgeOf(now);
 const badge=bNew&&bNew!==bOld?`<div class="badge pop"><span>🏅</span><div><b>Neues Abzeichen: ${bNew[1]}</b><p class="muted">Du hast schon ${now} Sterne gesammelt.</p></div></div>`:'';
 const nb=nextBadge(now);
 app.innerHTML=`<div class="quiz done pop"><span class="fach">${t.fach} · ${t.titel}</span>
  <div class="bigstars" style="letter-spacing:0">★ ${S.stars}</div>
  <h2>${S.right>=8?'Super gemacht!':S.right>=5?'Gut gemacht!':'Gut, dass du drangeblieben bist!'}</h2>
  <p class="num">${S.right} von ${SESSION} richtig · jetzt Stufe ${st.lvl} von 3</p>
  ${badge}
  ${nb?`<p class="muted">Noch ${nb[0]-now} Sterne bis zum Abzeichen „${nb[1]}“.</p>`:''}
  <div class="actions" style="justify-content:center"><button class="btn" id="again">Noch eine Runde</button><button class="btn ghost" id="more">Anderes Thema</button></div></div>`;
 $('#again').onclick=()=>{go({view:'kid',kid:S.kid});startUeben(t.id)};
 $('#more').onclick=()=>go({view:'kid',kid:S.kid});
}

function uebenRows(kid){
 return UEB[kid].map(t=>{const u=peekU(kid,t.id);
  if(!u||!u.total)return `<div class="row"><span>${t.fach}: ${t.titel}</span><span class="bar"><i style="width:0"></i></span><span class="pill open">noch nicht geübt</span></div>`;
  const p=Math.round(100*u.right/u.total),lv=level(p);
  return `<div class="row"><span>${t.fach}: ${t.titel} <span class="muted num">· Stufe ${u.lvl} · ${u.right}/${u.total} richtig · ${fmtDate(u.last)}</span></span><span class="bar"><i class="${lv}" style="width:${p}%"></i></span><span class="pill ${lv}">${p} %</span></div>`}).join('');
}
function fehlerList(kid){
 const L=((DB.fehler||{})[kid]||[]).slice(0,10);if(!L.length)return '';
 return `<details><summary>Letzte Fehler beim Üben (${L.length})</summary><ul>${L.map(e=>{const t=UEB[kid].find(x=>x.id===e.tid);return `<li>${esc(t?t.titel:'')}: ${esc(e.q)} <span class="muted">(Antwort: ${esc(e.given)}, Stufe ${e.lvl})</span></li>`}).join('')}</ul></details>`;
}
function uebenReport(){
 const lines=['','ÜBEN'];
 for(const kid of Object.keys(UEB)){
  lines.push(KIDS[kid].name+': '+sterne(kid)+' Sterne');
  UEB[kid].forEach(t=>{const u=peekU(kid,t.id);if(u&&u.total)lines.push('- '+t.titel+': Stufe '+u.lvl+', '+u.right+'/'+u.total+' richtig, zuletzt '+fmtDate(u.last));else lines.push('- '+t.titel+': noch nicht geübt')});
  ((DB.fehler||{})[kid]||[]).slice(0,10).forEach(e=>{const t=UEB[kid].find(x=>x.id===e.tid);lines.push('    falsch ('+(t?t.titel:'')+', Stufe '+e.lvl+'): '+e.q+' | Antwort: '+e.given)});
  lines.push('');
 }
 return lines.join('\n');
}

render();
</script>
